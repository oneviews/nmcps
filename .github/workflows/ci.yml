name: ci

# 回归门禁：静态检查 + 文档守卫 + BFF 网关契约 + 页面 UI 自查。
# 本地复跑同一套命令：
#   pnpm lint && pnpm typecheck && pnpm check:doc-system
#   pnpm build:server && pnpm check:bff
#   CHECK_UI_BASE_URL=http://127.0.0.1:3000 pnpm check:ui（需先起服务）
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint / typecheck / doc guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Lint
        run: |
          set +e
          pnpm lint 2>&1 | tee ci-logs/lint.log
          status=${PIPESTATUS[0]}
          sh scripts/ci-summary.sh "lint" ci-logs/lint.log
          exit $status

      - name: Typecheck
        run: |
          set +e
          pnpm typecheck 2>&1 | tee ci-logs/typecheck.log
          status=${PIPESTATUS[0]}
          sh scripts/ci-summary.sh "typecheck" ci-logs/typecheck.log
          exit $status

      - name: Doc system guard
        run: |
          set +e
          pnpm check:doc-system 2>&1 | tee ci-logs/doc-system.log
          status=${PIPESTATUS[0]}
          sh scripts/ci-summary.sh "doc system guard" ci-logs/doc-system.log
          exit $status

      - name: Upload quality check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-quality
          path: |
            ci-logs/lint.log
            ci-logs/typecheck.log
            ci-logs/doc-system.log
          if-no-files-found: ignore

  runtime:
    name: BFF contract / page UI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Build BFF
        run: pnpm build:server 2>&1 | tee ci-logs/build-server.log

      # 网关契约：脚本自己拉起 .output/server 与假上游，占用随机空闲端口。
      - name: Gateway contract checks
        run: |
          set +e
          pnpm check:bff 2>&1 | tee ci-logs/check-bff.log
          status=${PIPESTATUS[0]}
          sh scripts/ci-summary.sh "BFF gateway contract" ci-logs/check-bff.log
          exit $status

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # UI 自查：check:ui 默认指向内网 dev server，这里用 CHECK_UI_BASE_URL 指向本地构建产物。
      - name: Page UI checks
        run: |
          node .output/server/index.mjs > ci-logs/nitro.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:3000/health > /dev/null; then
            echo "server did not become ready on :3000" >&2
            cat ci-logs/nitro.log >&2
            exit 1
          fi
          set +e
          pnpm check:ui 2>&1 | tee ci-logs/check-ui.log
          status=${PIPESTATUS[0]}
          sh scripts/ci-summary.sh "page UI checks" ci-logs/check-ui.log
          exit $status
        env:
          HOST: 127.0.0.1
          PORT: 3000
          CHECK_UI_BASE_URL: http://127.0.0.1:3000
          CHECK_UI_SCREENSHOT: ${{ github.workspace }}/ui-check.png

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-screenshot
          path: ui-check.png
          if-no-files-found: ignore

      - name: Upload runtime check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-runtime
          path: |
            ci-logs/build-server.log
            ci-logs/check-bff.log
            ci-logs/check-ui.log
            ci-logs/nitro.log
          if-no-files-found: ignore
